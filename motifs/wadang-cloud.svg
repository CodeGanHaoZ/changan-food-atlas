<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" role="img" aria-label="汉瓦当云纹">
  <!--
    汉瓦当云纹 · Han Tile-End Cloud Motif
    用途：圆形徽记底纹、装饰角标、空状态插画、加载态
    用法：单色描边（currentColor），四向卷云由同一路径旋转 90° 生成
  -->
  <defs>
    <!-- 单向卷云臂：自中心向外延伸后回卷 -->
    <path id="wd-arm" d="M50 41V29A8 8 0 0 0 42 21H34"/>
  </defs>

  <!-- 外圈 -->
  <circle cx="50" cy="50" r="46.5" stroke="currentColor" stroke-width="2.5"/>
  <!-- 内圈（弱） -->
  <circle cx="50" cy="50" r="37" stroke="currentColor" stroke-width="1" opacity="0.4"/>

  <!-- 四向卷云 -->
  <g stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <use href="#wd-arm"/>
    <use href="#wd-arm" transform="rotate(90 50 50)"/>
    <use href="#wd-arm" transform="rotate(180 50 50)"/>
    <use href="#wd-arm" transform="rotate(270 50 50)"/>
  </g>

  <!-- 中心乳钉 -->
  <circle cx="50" cy="50" r="6.5" fill="currentColor"/>
  <!-- 乳钉外环 -->
  <circle cx="50" cy="50" r="11" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
</svg>

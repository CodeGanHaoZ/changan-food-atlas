<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40" fill="none" role="img" aria-label="回纹装饰带">
  <!--
    回纹装饰带 · Meander (Hui) Border Band
    用途：区块上/下沿边框、卡片顶部装饰、页眉页脚分隔
    用法：width="100%" height="40" preserveAspectRatio="none"，或作 CSS background-image
    也可直接取下方 pattern 定义嵌入业务 SVG
  -->
  <defs>
    <!-- 单格 40×40 回纹，横向平铺即成连续纹带 -->
    <pattern id="huiwen-tile" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M2 38V2h36v36H12V12h20v16h-8"
            stroke="currentColor" stroke-width="2.6" fill="none"
            stroke-linecap="square" stroke-linejoin="miter"/>
    </pattern>
  </defs>
  <rect width="160" height="40" fill="url(#huiwen-tile)"/>
</svg>

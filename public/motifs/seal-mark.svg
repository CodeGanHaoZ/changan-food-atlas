<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" role="img" aria-label="汉印方章">
  <!--
    汉印方章 · Han-Style Square Seal
    用途：编号角标、认证标识、卡片押印、作者署名装饰
    用法：主色建议 var(--cinnabar-600) 作朱文印；文字请用 --font-serif
    内为「田」字界格，可直接在其中嵌入 4 个汉字
  -->
  <!-- 外框（印边） -->
  <rect x="6" y="6" width="88" height="88" rx="5" stroke="currentColor" stroke-width="6.5"/>
  <!-- 内界格（田字） -->
  <g stroke="currentColor" stroke-width="2.4" opacity="0.85">
    <path d="M17 17h66v66H17z"/>
    <path d="M50 17v66M17 50h66"/>
  </g>
  <!-- 四角小缺口，模拟凿刻感 -->
  <g stroke="currentColor" stroke-width="2" opacity="0.35">
    <path d="M6 6l8 8M94 6l-8 8M6 94l8-8M94 94l-8-8"/>
  </g>
</svg>
